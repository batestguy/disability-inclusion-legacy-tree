name: Verify legacy archive
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  research-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Synthetic standard-library tests; no private source archive or NLP install.
      - run: python -m unittest discover -s scripts -p '*_test.py'
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run preflight
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static-preview
          path: apps/web/out
