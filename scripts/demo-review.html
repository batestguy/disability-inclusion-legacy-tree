<main>

<script>
let mode='desktop';
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{
 document.querySelectorAll('video').forEach(video=>video.pause());mode=button.dataset.mode;
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
 ['desktop','mobile'].forEach(name=>document.getElementById(name).hidden=name!==mode);
}));
document.getElementById('methods').addEventListener('click',()=>{const video=document.querySelector('#'+mode+' video');video.currentTime=138;video.focus();video.play().catch(()=>{});});
